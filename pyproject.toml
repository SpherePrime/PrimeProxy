[build-system]

requires = ["hatchling>=1.25.0"]

build-backend = "hatchling.build"



[project]

name = "swift-proxy"

dynamic=["version"]



description = "SwiftProxy — unified MTProto/WSS proxy with iOS 26 UI for Telegram Desktop"

readme = "docs/README.md"

requires-python = ">=3.9"



license = { text = "BUSL-1.1" }



authors = [

    { name = "LilKALINOV" }

]



keywords = [

    "telegram",

    "tdesktop",

    "proxy",

    "bypass",

    "websocket",

    "mtproto",

    "swiftproxy",

    "wss",

    "socks5",

]

classifiers = [

  "Development Status :: 4 - Beta",

  "Environment :: Console",

  "Intended Audience :: Customer Service",

  "Programming Language :: Python :: 3",

  "License :: Other/Proprietary License",

  "Operating System :: OS Independent",

  "Topic :: System :: Networking :: Firewalls",

]



dependencies = [

    "pywebview>=4.0,<6",

    "pyperclip>=1.9.0",

    "certifi",

    "psutil>=7.0.0; platform_system != 'Windows' or python_version >= '3.9'",

    "cryptography>=46.0.0",

    "Pillow>=12.1.0",

    "pystray>=0.19.5",

    "pyobjc-framework-Cocoa>=9.0; platform_system == 'Darwin'",

]



[project.scripts]

swift-proxy = "main:main"

swift-proxy-gui = "main:main"



[project.urls]

Source = "https://github.com/Lil-KALINOV/SwiftProxy"

Issues = "https://github.com/Lil-KALINOV/SwiftProxy/issues"



[tool.hatch.build.targets.wheel]

packages = ["proxy", "config", "telegram", "dns", "hosts", "lists", "ui", "utils", "tray", "blockcheck"]



[tool.hatch.build.force-include]

"main.py" = "main.py"
"cli.py" = "cli.py"



[tool.hatch.version]

path = "config/__init__.py"



[tool.ruff]

target-version = "py39"



[tool.ruff.lint]

select = ["E4", "E7", "E9", "F", "B", "C4"]

ignore = ["F403", "F405", "B023"]