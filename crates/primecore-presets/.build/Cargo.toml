[package]
name = "primecore-presets"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
regex = "1"
once_cell = "1"
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
blake2b_simd = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
primecore-files = { path = "../../primecore-files" }
primecore-mode = { path = "../../primecore-mode" }
primecore-profile = { path = "../../primecore-profile" }
primecore-lists = { path = "../../primecore-lists" }
