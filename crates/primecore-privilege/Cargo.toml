[package]
name = "primecore-privilege"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Модуль привилегий: sudo один раз при первом запуске, демон privd и клиент сокета."

# Транспорт платформенный: на unix — unix-сокет (src/client_unix.rs,
# src/bin/privd.rs), на Windows постоянного помощника нет (права повышает
# UAC на один процесс), поэтому клиент отвечает понятной ошибкой
# (src/client_windows.rs), а демон сразу сообщает об этом и выходит.
# Общая часть — состояние, TTL и протокол — одна для всех платформ.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
